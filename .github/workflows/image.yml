name: image

# The box, built for Apple Silicon and Intel alike, published where the IMD Agents app pulls it from:
# ghcr.io/gtmcknight/imd-worker-box. Logins, the worker and pairing live in a volume, never the image.
on:
  push:
    branches: [main]
    paths: [Dockerfile, entrypoint.sh, setup.sh, install-foundry.sh, .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/gtmcknight/imd-worker-box:latest
            ghcr.io/gtmcknight/imd-worker-box:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/gtmcknight/imd-worker-box
            org.opencontainers.image.description=The IMD worker in a box that sees none of the computer it runs on
          cache-from: type=gha
          cache-to: type=gha,mode=max
